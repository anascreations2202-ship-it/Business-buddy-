<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171923">
<title>Business Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8F0;--card:#FFFFFF;--tx:#171923;--mut:#6b6f80;--ink:#7047EB;--inkt:#FFFFFF;--sec:#EDE7FF;--sect:#7047EB;--hd:#171923;--hdt:#FFFFFF;--acc:#EDE7FF;--bd:#eadfce;--ok:#15803d;--lo:#b45309;--no:#b91c1c;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1d2030;--tx:#f1f0f8;--mut:#a5a8bd;--sec:#2a2450;--sect:#c9b8ff;--bd:#2c3048;--ok:#4ade80;--lo:#fbbf24;--no:#f87171}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1d2030;--tx:#f1f0f8;--mut:#a5a8bd;--sec:#2a2450;--sect:#c9b8ff;--bd:#2c3048;--ok:#4ade80;--lo:#fbbf24;--no:#f87171}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 Mukta,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
header{background:var(--hd);color:var(--hdt);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 14px}
header h1{margin:0;font-size:22px;font-weight:800;color:var(--hdt)}
header p{margin:0;color:inherit;opacity:.8;font-size:14px}
#app{padding:8px 16px;max-width:560px;margin:0 auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.m{color:var(--mut);font-size:14px}
h2{margin:4px 0 8px;font-size:20px}
h3{margin:14px 0 4px;font-size:16px}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mut)}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
.b{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ink);color:var(--inkt);font:inherit;font-weight:600;cursor:pointer}
.b.s{background:var(--sec);color:var(--sect);border:0}
.b.d{background:transparent;color:var(--no);border:1px solid var(--no)}
.hero{background:var(--ink);color:var(--inkt);border-radius:18px;padding:18px;margin:10px 0}
.hero .m{color:#e3d9ff}
.hero .big{font-size:40px;font-weight:800;line-height:1.1;margin:2px 0 0;border-bottom:4px solid var(--acc);display:inline-block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .c{margin:0}
.n{font-size:22px;font-weight:800}
.tag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.lo{color:var(--lo)}.no{color:var(--no)}
.pl{color:var(--ok)}.mi{color:var(--no)}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--inkt);border-color:var(--ink)}
#nav{position:fixed;left:0;right:0;bottom:0;display:none;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;padding:6px 0;cursor:pointer}
#nav button span{display:block;font-size:20px}
#nav button.on{color:var(--ink);font-weight:800}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.bub{padding:10px 12px;border-radius:12px;margin:6px 0;white-space:pre-wrap}
.bu{background:var(--ink);color:var(--inkt);margin-left:24px}
.ba{background:var(--bg);border:1px solid var(--bd);margin-right:24px}
html:lang(ur) body{font-family:"Noto Naskh Arabic",Mukta,system-ui,sans-serif}
</style>
</head>
<body>
<header><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><img id="logo" alt="" style="display:none;width:42px;height:42px;border-radius:10px;object-fit:cover"><div style="flex:1"><h1 id="ttl">Business Buddy</h1><p id="sub"></p></div><button id="gear" onclick="T('set')" aria-label="Settings" style="background:none;border:0;padding:6px;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button><select id="lg" onchange="setL(this.value)" aria-label="Language" style="width:auto;background:#2b2e3d;color:#fff;border:0;padding:8px"><option value="hl">Hinglish</option><option value="en">English</option><option value="hi">हिन्दी</option><option value="ur">اردو</option></select></div></header>
<div id="app"></div>
<nav id="nav">
<button data-t="home" onclick="T('home')"><span>🏠</span>Home</button>
<button data-t="prod" onclick="T('prod')"><span>📦</span>Saman</button>
<button data-t="sale" onclick="T('sale')"><span>🛒</span>Bikri</button>
<button data-t="his" onclick="T('his')"><span>📒</span>Hisaab</button>
<button data-t="ai" onclick="T('ai')"><span>✨</span>AI</button>
<button data-t="cust" onclick="T('cust')"><span>👥</span>Grahak</button>
</nav>
<script>
const $=s=>document.querySelector(s);
let S=null;
try{S=JSON.parse(localStorage.getItem('bb')||'null')}catch(e){}
S=S||{shop:'',biz:'',p:[],s:[],e:[]};S.u=S.u||[];S.cfg=S.cfg||{};S.cfg.tabs=S.cfg.tabs||{};
const save=()=>{try{localStorage.setItem('bb',JSON.stringify(S))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN');
const dy=t=>new Date(t).toDateString();
const mo=t=>{const a=new Date(t),b=new Date();return a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()};
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const track=()=>S.biz!=='Services';
let tab='home',edit=null,cedit=null,per='d';

function st(p){if(!track())return null;return p.q<=0?['Khatam','no']:p.q<=p.m?['Kam stock','lo']:['Available','ok']}
function T(t){tab=t;edit=null;cedit=null;R()}

function R(){
  const a=$('#app');
  if(!S.biz){$('#nav').style.display='none';a.innerHTML=setup();return}
  $('#nav').style.display='flex';
  $('#ttl').textContent=S.shop||'Business Buddy';
  $('#sub').textContent=tr(S.biz)+' · '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  if(tab!=='home'&&tab!=='set'&&S.cfg.tabs[tab]===false)tab='home';a.innerHTML=cedit?cform():edit?form():({home,prod,sale,his,ai,cust,set:setV})[tab]();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}

function setup(){return `<div class="c"><h2>Swagat hai 👋</h2><p class="m">Apni dukaan ki jaankari bharo. Yeh sirf ek baar poochha jayega.</p>
<label>Dukaan ka naam</label><input id="sn" placeholder="jaise: Anas Store">
<label>Business type</label><select id="bt"><option value="Retail dukaan">Retail dukaan</option><option value="Restaurant">Restaurant</option><option value="Wholesale">Wholesale</option><option value="Services">Services</option><option value="Online seller">Online seller</option><option value="Other">Other</option></select>
<button class="b" onclick="go()">Shuru karo</button></div>`}
function go(){S.shop=$('#sn').value.trim();S.biz=$('#bt').value;save();R()}

function home(){
  const td=Date.now(),ts=S.s.filter(x=>dy(x.t)===dy(td)),te=S.e.filter(x=>dy(x.t)===dy(td));
  const inc=sum(ts,x=>x.q*x.pr),cost=sum(ts,x=>x.q*x.c),ex=sum(te,x=>x.a),pf=inc-cost-ex;
  const low=track()?S.p.filter(p=>st(p)[1]!=='ok'):[];
  return `<div class="hero"><div class="m">Aaj ka munafa</div><div class="big">${inr(pf)}</div></div>
<div class="grid"><div class="c"><div class="m">Aaj ki bikri</div><div class="n">${inr(inc)}</div></div><div class="c"><div class="m">Aaj ka kharcha</div><div class="n">${inr(ex)}</div></div></div>
${track()?`<h3>Stock par nazar</h3>${'Notification'in window&&Notification.permission!=='granted'?`<button class="b s" onclick="enableStockNotifications()">Stock notifications enable karo</button>`:''}${low.length?low.map(p=>`<div class="c row" onclick="ed('${p.id}')"><div><b>${esc(p.n)}</b><div class="m">Bacha: ${p.q}${p.sp?' · '+esc(p.sp):''}</div></div><span class="tag ${st(p)[1]}">${st(p)[0]}</span></div>`).join(''):`<div class="empty">${S.p.length?'Sab saman available hai ✅':'Pehle Saman tab mein products jodo.'}</div>`}`:''}
${S.p.length?'':`<button class="b" onclick="ed('new')">Pehla product jodo</button>`}`}

function prod(){
  return `<button class="b" style="margin-top:6px" onclick="ed('new')">+ Naya ${track()?'product':'service'} jodo</button>`+
  (S.p.length?S.p.map(p=>{const s=st(p);return `<div class="c row" onclick="ed('${p.id}')"><div><b>${esc(p.n)}</b><div class="m">${inr(p.pr)}${track()?' · Stock '+p.q:''}${p.sp?' · '+esc(p.sp):''}</div></div>${s?`<span class="tag ${s[1]}">${s[0]}</span>`:''}</div>`}).join(''):`<div class="empty">Abhi koi ${track()?'product':'service'} nahi hai. Upar wala button dabao.</div>`);
}

function ed(id){edit=id;R()}
function form(){
  const n=edit==='new',p=n?{n:'',pr:'',c:'',q:'',m:5,sp:''}:S.p.find(x=>x.id===edit);
  return `<div class="c"><h2>${n?'Naya jodo':'Badlav karo'}</h2>
<label>Naam</label><input id="fn" value="${esc(p.n)}">
<label>Bechne ka daam (₹)</label><input id="fp" type="number" inputmode="decimal" value="${p.pr}">
<label>Kharid daam (₹)</label><input id="fc" type="number" inputmode="decimal" value="${p.c}">
${track()?`<label>Stock (kitna hai)</label><input id="fq" type="number" inputmode="numeric" value="${p.q}">
<label>Kam stock alert (is se kam ho to batao)</label><input id="fm" type="number" inputmode="numeric" value="${p.m}">`:''}
<label>Kahan se aata hai (supplier)</label><input id="fs" value="${esc(p.sp)}" placeholder="jaise: Sharma Traders, Katni">
<button class="b" onclick="saveP()">Save karo</button>
<button class="b s" onclick="T('prod')">Wapas</button>
${n?'':`<button class="b d" onclick="delP()">Hata do</button>`}</div>`}
function saveP(){
  const n=$('#fn').value.trim();if(!n){alert('Naam likho');return}
  const o={n,pr:+$('#fp').value||0,c:+$('#fc').value||0,q:track()?(+$('#fq').value||0):0,m:track()?(+$('#fm').value||0):0,sp:$('#fs').value.trim()};
  if(edit==='new')S.p.push({id:uid(),...o});else Object.assign(S.p.find(x=>x.id===edit),o);
  save();T('prod')}
function delP(){if(confirm('Yeh hata dein?')){S.p=S.p.filter(x=>x.id!==edit);save();T('prod')}}

function sale(){
  if(!S.p.length)return `<div class="empty">Bikri likhne se pehle Saman tab mein kuch jodo.</div>`;
  const ts=S.s.filter(x=>dy(x.t)===dy(Date.now())).slice().reverse();
  return `<div class="c"><h2>Bikri likho</h2>
<label>Kya becha</label><select id="sp" onchange="pick()">${S.p.map(p=>`<option value="${p.id}">${esc(p.n)}${track()?' (stock '+p.q+')':''}</option>`).join('')}</select>
<label>Kitna (quantity)</label><input id="sq" type="number" inputmode="numeric" value="1" min="1">
<label>Daam per piece (₹)</label><input id="sr" type="number" inputmode="decimal" value="${S.p[0].pr}">
<label>Abhi kitna payment mila? (₹) — baaki udhar rahega</label><input id="spaid" type="number" inputmode="decimal" value="0" min="0">
<label>Grahak (optional)</label><select id="sc"><option value="">Walk-in grahak</option>${S.u.map(u=>`<option value="${u.id}">${esc(u.n)}</option>`).join('')}</select>
<button class="b" onclick="sell()">Bikri save karo</button></div>
<h3>Aaj ki bikri</h3>${ts.length?ts.map(x=>`<div class="c row" style="cursor:default"><div><b>${esc(x.n)}</b><div class="m">${x.q} × ${inr(x.pr)}</div></div><b>${inr(x.q*x.pr)}</b></div>`).join(''):`<div class="empty">Aaj abhi tak koi bikri nahi.</div>`}`}
function pick(){const p=S.p.find(x=>x.id===$('#sp').value);if(p)$('#sr').value=p.pr}
function sell(){
  const p=S.p.find(x=>x.id===$('#sp').value),q=+$('#sq').value,pr=+$('#sr').value;
  if(!p||q<=0){alert('Quantity sahi likho');return}
  if(track()&&q>p.q){alert('Itna stock nahi hai. Abhi '+p.q+' bacha hai.');return}
  if(track())p.q-=q;
  const total=q*pr,paid=Math.max(0,Math.min(total,+($('#spaid')?.value||0)));S.s.push({id:uid(),pid:p.id,n:p.n,q,pr,c:p.c,cid:$('#sc').value||null,paid,due:total-paid,payments:paid?[{amount:paid,t:Date.now()}]:[],t:Date.now()});save();R()}

function his(){
  const f=t=>per==='a'||(per==='m'?mo(t):dy(t)===dy(Date.now()));
  const ss=S.s.filter(x=>f(x.t)),ee=S.e.filter(x=>f(x.t));
  const inc=sum(ss,x=>x.q*x.pr),cost=sum(ss,x=>x.q*x.c),ex=sum(ee,x=>x.a),pf=inc-cost-ex;
  const L=[...ss.map(x=>({t:x.t,k:'s',x})),...ee.map(x=>({t:x.t,k:'e',x}))].sort((a,b)=>b.t-a.t).slice(0,40);
  const sg=(k,l)=>`<button class="${per===k?'on':''}" onclick="per='${k}';R()">${l}</button>`;
  return `<div class="seg">${sg('d','Aaj')}${sg('m','Is mahine')}${sg('a','Sab')}</div>
<div class="hero"><div class="m">Munafa</div><div class="big">${inr(pf)}</div></div>
<div class="grid"><div class="c"><div class="m">Bikri</div><div class="n">${inr(inc)}</div></div><div class="c"><div class="m">Maal ki laagat</div><div class="n">${inr(cost)}</div></div><div class="c"><div class="m">Kharcha</div><div class="n">${inr(ex)}</div></div><div class="c"><div class="m">Bikri ki entries</div><div class="n">${ss.length}</div></div></div>
<div class="c"><h2>Kharcha likho</h2><label>Kis cheez ka (kiraya, bijli, salary...)</label><input id="en"><label>Kitna (₹)</label><input id="ea" type="number" inputmode="decimal"><button class="b" onclick="addE()">Kharcha save karo</button></div>
<h3>Khata</h3>${L.length?L.map(r=>r.k==='s'?`<div class="c row" style="cursor:default"><div><b>${esc(r.x.n)}</b><div class="m">${r.x.q} × ${inr(r.x.pr)} · ${new Date(r.t).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div></div><b class="pl">+${inr(r.x.q*r.x.pr)}</b></div>`:`<div class="c row" style="cursor:default"><div><b>${esc(r.x.n)}</b><div class="m">Kharcha · ${new Date(r.t).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div></div><b class="mi">−${inr(r.x.a)}</b></div>`).join(''):`<div class="empty">Is samay ki koi entry nahi.</div>`}`}
function addE(){const n=$('#en').value.trim(),a=+$('#ea').value;if(!n||a<=0){alert('Naam aur amount likho');return}S.e.push({id:uid(),n,a,t:Date.now()});save();R()}

let chat=[],pend=null,busy=false,aqv='',SM=null,vm=false,vo=false,att=[],att2=[],cqv='',IMG=true;
async function api(payload){const r=await fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw new Error(j.error||'AI request failed');return j}
SM=async (history,opts={})=>{const last=history[history.length-1]||{};return {text:(await api({action:'chat',messages:history,context:ctx(),language:S.lang||'hl'})).text}}
SM.json=async prompt=>api({action:'parse',prompt,context:ctx(),language:S.lang||'hl'}).data;

function ctx(){const td=S.s.filter(x=>dy(x.t)===dy(Date.now())),ms=S.s.filter(x=>mo(x.t)),me=S.e.filter(x=>mo(x.t));
return `Business type: ${S.biz}\nDukaan: ${S.shop||'-'}\nProducts: ${S.p.map(p=>`${p.n} (bech ${p.pr}, kharid ${p.c}, stock ${p.q}${p.sp?', supplier '+p.sp:''})`).join('; ')||'koi nahi'}\nAaj ki bikri: ${sum(td,x=>x.q*x.pr)}\nIs mahine: bikri ${sum(ms,x=>x.q*x.pr)}, maal laagat ${sum(ms,x=>x.q*x.c)}, kharcha ${sum(me,x=>x.a)}\nTotal customer udhar: ${sum(S.s,x=>x.due??Math.max(0,x.q*x.pr-(x.paid||0)))}`}
function ai(){
 if(!SM)return `<div class="empty">AI abhi load ho raha hai ya is jagah available nahi hai.<br>Link ko claude.ai ya Claude app mein kholo aur AI ko ijazat do.</div>`;
 return `<div class="c"><h2>Bolkar entry likho</h2><p class="m">Jaise: 5 shirt 500 mein becha, 2000 kiraya diya</p>
<input id="aq" value="${esc(aqv)}" placeholder="Yahan likho ya mic dabao">
<div class="grid" style="margin-top:10px"><button class="b s" style="margin:0" onclick="mic('aq')">🎤 Bolo</button><button class="b" style="margin:0" onclick="parseE()">Samjho</button></div><button class="b s" onclick="$('#cam2').click()">📷 Bill ya register ki photo</button><input id="cam2" type="file" accept="image/*,.txt,.csv" hidden onchange="addF(this,2)">${att2.length?`<p class="m">Judi hui: ${att2.map(a=>esc(a.name)).join(', ')}</p>`:''}${prev()}</div>
<div class="c"><h2>AI Product Photo</h2><p class="m">Product ka naam aur style likho. AI promotional product image banane ki koshish karega.</p><input id="imgprompt" placeholder="Jaise: premium black water bottle, studio product photo"><button class="b" onclick="genProductImage()">Product photo banao</button><div id="imgresult"></div></div><div class="c"><h2>Business salah</h2>${chat.length?chat.map(m=>`<div class="bub ${m.role==='user'?'bu':'ba'}">${esc(m.content)}</div>`).join(''):`<p class="m">Apna sawal poochho, ya neeche se chuno.</p>`}${busy?'<p class="m">Soch raha hoon...</p>':''}
<div class="seg"><button onclick="sug('Kaun sa saman jaldi mangwana chahiye?')">Kya mangwau?</button><button onclick="sug('Mera munafa kaise badhe?')">Munafa badhao</button></div>
<input id="cq" value="${esc(cqv)}" oninput="cqv=this.value" placeholder="Apna sawal likho">
<div class="grid" style="margin-top:10px"><button class="b s" style="margin:0" onclick="$('#cam').click()">📷 Camera</button><button class="b s" style="margin:0" onclick="$('#fil').click()">📎 Photo ya file</button></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden onchange="addF(this,1)"><input id="fil" type="file" accept="image/*,.txt,.csv,.json,.md" multiple hidden onchange="addF(this,1)">
${att.length?`<p class="m">Judi hui: ${att.map(a=>esc(a.name)).join(', ')} <button class="tag" style="background:none;color:var(--no)" onclick="att=[];R()">hatao</button></p>`:''}
<div class="grid" style="margin-top:10px"><button class="b s" style="margin:0" onclick="vtog()">${vm?'⏹ Baatcheet band':'🎤 Baatcheet shuru'}</button><button class="b" style="margin:0" onclick="ask()">Poochho</button></div>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${vo?'checked':''} onchange="vo=this.checked"> Jawab awaaz mein sunao</label></div>`}

function prev(){
 if(!pend)return '';
 if(pend.err)return `<p class="no">Samajh nahi aaya. Dobara likho, jaise: 5 shirt 500 mein becha.</p>`;
 const ss=pend.sales||[],ee=pend.expenses||[];
 if(!ss.length&&!ee.length)return `<p class="m">Koi bikri ya kharcha nahi mila. Dobara likho.</p>`;
 return `<h3>Yeh save karun?</h3>`+ss.map(x=>{const p=S.p.find(y=>y.id===x.pid);return `<div class="c"><b>Bikri: ${esc(p?p.n:x.name)}</b><div class="m">${x.qty} × ${inr(x.price??(p?p.pr:0))}${p?'':' · list mein nahi hai'}</div></div>`}).join('')+ee.map(x=>`<div class="c"><b>Kharcha: ${esc(x.name)}</b><div class="m">${inr(x.amount)}</div></div>`).join('')+`<button class="b" onclick="applyE()">Haan, save karo</button><button class="b s" onclick="pend=null;R()">Cancel</button>`}
async function parseE(){
 const t=$('#aq').value.trim();if(!t||!SM||busy)return;
 aqv=t;busy=true;pend=null;R();
 try{
  const prods=S.p.map(p=>({id:p.id,name:p.n,price:p.pr,stock:p.q}));
  const imgs=att2.filter(a=>a.img).map(a=>a.blob),ft=att2.filter(a=>a.text).map(a=>a.text).join(' ');att2=[];
  pend=await SM.json(`Tum ek dukaan ke hisaab ke madadgaar ho. User ka message Hindi, Urdu, English ya Hinglish mein ho sakta hai. Usse bikri aur kharche ki entries nikalo.\nProducts: ${JSON.stringify(prods)}\nMessage: ${t}\nSirf JSON do, is shape mein: {"sales":[{"pid":"product id ya null","name":"naam","qty":number,"price":number ya null}],"expenses":[{"name":"kis cheez ka","amount":number}]}\nNiyam: pid sirf upar ki list se ho, warna null. Price na likha ho to null. Kuch na mile to khali lists. Photo ya file ho to usme se bhi entries nikalo. File ka text: ${ft}`,imgs.length&&IMG?{images:imgs}:{});
 }catch(e){pend={err:1}}
 busy=false;R()}
function applyE(){
 (pend.sales||[]).forEach(x=>{const p=S.p.find(y=>y.id===x.pid),q=+x.qty||0;if(q<=0)return;
  if(p&&track())p.q=Math.max(0,p.q-q);
  S.s.push({id:uid(),pid:p?p.id:null,n:p?p.n:String(x.name||'Saman'),q,pr:+(x.price??(p?p.pr:0))||0,c:p?p.c:0,t:Date.now()})});
 (pend.expenses||[]).forEach(x=>{const a=+x.amount||0;if(a>0)S.e.push({id:uid(),n:String(x.name||'Kharcha'),a,t:Date.now()})});
 pend=null;aqv='';save();T('his')}
function sug(t){$('#cq').value=t;ask()}
async function addF(el,w){
 const c=$('#cq'),a=$('#aq');if(c)cqv=c.value;if(a)aqv=a.value;
 const L=[...el.files];el.value='';const T2=w==2?att2:att;
 for(const f of L){
  if(f.size>8e6){alert(f.name+' bahut badi hai. 8 MB se chhoti rakho.');continue}
  if(f.type.startsWith('image/'))T2.push({name:f.name,blob:f,img:1});
  else if(/\.(txt|csv|json|md)$/i.test(f.name)){try{T2.push({name:f.name,text:(await f.text()).slice(0,12000)})}catch(e){}}
  else alert('Abhi sirf photo, txt, csv, json file chalti hai.');
 }
 R()}
function voice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert('Is browser mein awaaz nahi chalti. Chrome try karo ya type karo.');vm=false;R();return}
 const r=new SR();r.lang=SL();
 r.onresult=e=>{const c=$('#cq');if(c){c.value=e.results[0][0].transcript;ask()}};
 r.onerror=()=>{vm=false;R()};
 r.start()}
function vtog(){vm=!vm;if(vm)vo=true;R();if(vm)voice();else{try{speechSynthesis.cancel()}catch(e){}}}
function say(t){
 try{if(!window.speechSynthesis)return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(t).slice(0,600));u.lang=SL();
  u.onend=()=>{if(vm)voice()};speechSynthesis.speak(u)}catch(e){}}
async function ask(){
 const A=att,q=$('#cq').value.trim()||(A.length?'Is photo ya file ke baare mein batao.':'');if(!q||!SM||busy)return;att=[];cqv='';
 chat.push({role:'user',content:q+(A.length?' 📎 '+A.map(a=>a.name).join(', '):'')});busy=true;R();
 try{
  const sys=`Tum Business Buddy ho. SIRF business, dukaan, sales, inventory, customers, payments, udhar, pricing, suppliers, expenses, profit, marketing aur business operations par madad karo. In topics par user ke natural language, spelling mistakes, short forms aur follow-up context ko samjho; fixed commands tak limited mat raho. Non-business chit-chat ya personal-life sawalon par vinamrata se kaho ki tum business assistant ho. Jawab user ki message wali bhasha mein do (Hinglish, Hindi, Urdu ya English), chhote practical steps ke saath. Hisaab sirf neeche diye actual numbers se karo.\n\nDukaan ki jaankari:\n${ctx()}`;
  const h=chat.slice(-7).map(m=>({...m}));const ft=A.filter(a=>a.text).map(a=>'File '+a.name+': '+a.text).join(' ');if(ft)h[h.length-1].content+=' '+ft;h[0].content=sys+'\n\nSawal: '+h[0].content;
  const imgs=A.filter(a=>a.img).map(a=>a.blob);if(imgs.length&&!IMG)alert('Is jagah photo nahi padhi ja sakti. Sirf text jayega.');const r=await SM(h,imgs.length&&IMG?{cache:false,images:imgs}:{cache:false});chat.push({role:'assistant',content:r.text});if(vo)say(r.text);
 }catch(e){vm=false;chat.push({role:'assistant',content:'Abhi jawab nahi mil paya. Thodi der baad dobara try karo.'})}
 busy=false;R()}

function cust(){return `<button class="b" style="margin-top:6px" onclick="cd('new')">+ Naya grahak jodo</button>`+(S.u.length?S.u.map(u=>`<div class="c row" onclick="cd('${u.id}')"><div><b>${esc(u.n)}</b><div class="m">${esc(u.ph||'-')}${u.ad?' · '+esc(u.ad):''}</div></div><b>${inr(sum(S.s.filter(x=>x.cid===u.id),x=>x.due??Math.max(0,x.q*x.pr-(x.paid||0))))} due</b></div>`).join(''):`<div class="empty">Abhi koi grahak nahi hai. Upar wala button dabao.</div>`)}
function cd(id){cedit=id;R()}
function cform(){
 const n=cedit==='new',u=n?{n:'',ph:'',ad:'',nt:''}:S.u.find(x=>x.id===cedit),all=n?[]:S.s.filter(x=>x.cid===u.id).slice().reverse(),due=n?0:sum(all,x=>x.due??Math.max(0,x.q*x.pr-(x.paid||0)));
 return `<div class="c"><h2>${n?'Naya grahak':'Grahak ki jaankari'}</h2><label>Naam</label><input id="un" value="${esc(u.n)}"><label>Mobile number</label><input id="up" type="tel" inputmode="tel" value="${esc(u.ph)}"><label>Pata (address)</label><input id="ua" value="${esc(u.ad)}"><label>Note</label><input id="ut" value="${esc(u.nt)}"><button class="b" onclick="saveC()">Save karo</button><button class="b s" onclick="T('cust')">Wapas</button>${n?'':`<button class="b d" onclick="delC()">Hata do</button>`}</div>`+(n?'':`<div class="grid"><div class="c"><div class="m">Kul kharid</div><div class="n">${inr(sum(all,x=>x.q*x.pr))}</div></div><div class="c"><div class="m">Bikri ki entries</div><div class="n">${all.length}</div></div></div><div class="c"><h3 style="margin-top:0">Udhar / Payment</h3><div class="m">Baaki udhar</div><div class="n">${inr(due)}</div><label>Payment receive karo (₹)</label><input id="payamt" type="number" inputmode="decimal" min="1" placeholder="Amount"><button class="b" onclick="receivePay()">Payment save karo</button></div><h3>Kharid ka itihaas</h3>`+all.slice(0,20).map(x=>`<div class="c row" style="cursor:default"><div><b>${esc(x.n)}</b><div class="m">${x.q} × ${inr(x.pr)} · Paid ${inr(x.paid||0)} · Due ${inr(x.due??Math.max(0,x.q*x.pr-(x.paid||0)))} · ${new Date(x.t).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div></div><b>${inr(x.q*x.pr)}</b></div>`).join(''))}
function saveC(){
 const n=$('#un').value.trim(),ph=$('#up').value.trim();
 if(!n){alert('Naam likho');return}
 if(ph&&!/^[0-9+ ]{10,14}$/.test(ph)){alert('Mobile number sahi likho');return}
 const o={n,ph,ad:$('#ua').value.trim(),nt:$('#ut').value.trim()};
 if(cedit==='new')S.u.push({id:uid(),...o});else Object.assign(S.u.find(x=>x.id===cedit),o);
 save();T('cust')}
function receivePay(){const a=+$('#payamt').value;if(a<=0){alert('Amount sahi likho');return}let left=a;const rows=S.s.filter(x=>x.cid===cedit&&((x.due??Math.max(0,x.q*x.pr-(x.paid||0)))>0)).sort((a,b)=>a.t-b.t);for(const x of rows){if(left<=0)break;const d=x.due??Math.max(0,x.q*x.pr-(x.paid||0)),v=Math.min(d,left);x.paid=(x.paid||0)+v;x.due=d-v;x.payments=x.payments||[];x.payments.push({amount:v,t:Date.now()});left-=v}if(left>0)alert('Extra amount '+inr(left)+' record nahi hua; sirf udhar adjust hua.');save();R()}
function delC(){if(confirm('Yeh hata dein?')){S.u=S.u.filter(x=>x.id!==cedit);save();T('cust')}}
